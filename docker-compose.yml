services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: dscboard, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, retries: 20 }
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/dscboard
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: change-me-32-bytes-min-secret-key-value
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [backend]
volumes: { pgdata: {} }
